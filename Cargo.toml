[package]
name = "lu-milter"
version = "0.1.0"
authors = ["Waitman Gobble"]
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.5"
percent-encoding = "2.3"
base64 = "0.22"
log = "0.4"
simplelog = "0.12"
chrono = "0.4"
time = "0.3"
indymilter = "0.3"
tokio = { version = "1.44", features = ["full"] }
byte-strings = "0.3"
daemonize = "0.5"
rand = "0.8"
rsa = { version="0.9", features = ["sha2"] }
hmac = "0.12"
nix = { version="0.29", features = ["user"] }
users = "0.11"
futures = "0.3"
